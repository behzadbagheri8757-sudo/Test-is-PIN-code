function dashTile(href, ico, title, sub){
  return `<a class="dash-tile" href="${href}">
    <span class="dash-ico">${ico}</span>
    <span class="dash-title">${title}</span>
    ${sub ? `<span class="dash-sub">${sub}</span>` : ''}
  </a>`;
}

function recentInvoicesHtml(){
  const invs = (data.invoices || []).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || String(b.number).localeCompare(String(a.number)));
  const top = invs.slice(0, 5);
  if(!top.length) return '';
  const rows = top.map(inv=>{
    const cust = data.customers.find(c=>c.id===inv.customerId);
    const name = cust ? cust.name : '—';
    return `<a class="ledger-row" href="./invoice.html?id=${encodeURIComponent(inv.id)}">
      <span class="name">فاکتور #${esc(String(inv.number||''))}<span class="sub">${esc(name)} — ${faDate(inv.date)}</span></span>
      <span class="filler"></span>
      <span class="amount">${toman(inv.total)} ت</span>
    </a>`;
  }).join('');
  return `<div class="dash-section-label">آخرین فاکتورها</div><div class="dash-activity">${rows}</div>`;
}

function recentVisitsHtml(){
  const items = [];
  (data.customers||[]).forEach(c=>{
    (c.visits||[]).forEach(v=>{
      items.push({ customerId:c.id, name:c.name, date:v.date, time:v.time, result:v.result });
    });
  });
  items.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.time||'').localeCompare(a.time||''));
  const top = items.slice(0, 5);
  if(!top.length) return '';
  const rows = top.map(v=>`<a class="ledger-row" href="./customer.html?id=${encodeURIComponent(v.customerId)}">
    <span class="name">${esc(v.name)}<span class="sub">${faDate(v.date)}${v.time?' '+esc(v.time):''} — ${esc(v.result||'')}</span></span>
    <span class="filler"></span>
    <span class="amount">ویزیت</span>
  </a>`).join('');
  return `<div class="dash-section-label">آخرین ویزیت‌ها</div><div class="dash-activity">${rows}</div>`;
}

  const nav = document.getElementById('nav');
  if(nav) nav.style.display = 'none';

  const main = document.getElementById('main');
  const g = globalTotals();
  const invVal = inventoryValue();
  const custN = data.customers.length;
  const prodN = data.products.length;
  const invN = data.invoices.length;
  const supN = data.suppliers.length;
  const payN = (data.payments||[]).length;
  const chkN = (data.checks||[]).length;

  // Read-only: existing Prospect daily target (no new target system)
  let targetHtml = '';
  try{
    if(typeof openProspectDatabase === 'function' && !prospectDbInstance){
      await openProspectDatabase();
    }
    if(typeof ensureProspectDailyTarget === 'function'){

      targetHtml = renderDashboardTargetBar(dt);
    }

    console.warn('dashboard target read skipped', err);
    targetHtml = '';
  }

  main.innerHTML = `
    <h2 class="section-title" style="margin-top:4px;">داشبورد</h2>

    ${targetHtml}

    <div class="dash-section-label">خلاصه وضعیت</div>

        <div class="label" style="margin-top:4px;">${g.todayCount||0} فاکتور</div>
      </div>
      <div class="dash-stat">
        <div class="label">فروش این ماه</div>
        <div class="value accent-olive">${toman(g.monthSales)} ت</div>
        <div class="label" style="margin-top:4px;">${g.monthCount||0} فاکتور</div>
      </div>
      <div class="dash-stat">
        <div class="label">بدهی مشتریان</div>
        <div class="value accent-rust">${toman(g.customerDebt)} ت</div>
      </div>
      <div class="dash-stat">
        <div class="label">بدهی به تامین‌کننده‌ها</div>
        <div class="value accent-rust">${toman(g.supplierDebt)} ت</div>
      </div>
      <div class="dash-stat">
        <div class="label">ارزش موجودی انبار</div>
        <div class="value">${toman(invVal)} ت</div>
      </div>
      <div class="dash-stat">
        <div class="label">سود کل (از فاکتورها)</div>
        <div class="value accent-amber">${toman(g.totalProfit)} ت</div>
      </div>
      <div class="dash-stat wide">
        <div class="label">جمع کل فروش فاکتورها</div>
        <div class="value">${toman(g.totalSales)} ت</div>
      </div>
    </div>

    <div class="dash-section-label">دسترسی سریع</div>
    <div class="dash-grid">
      ${dashTile('./invoices.html', ICO.invoice, 'فاکتورها', invN + ' فاکتور')}
      ${dashTile('./customers.html', ICO.users, 'مشتریان', custN + ' نفر')}
      ${dashTile('./payments.html', ICO.card, 'پرداخت‌ها', payN + ' مورد')}
      ${dashTile('./products.html', ICO.box, 'اجناس', prodN + ' قلم')}
      ${dashTile('./suppliers.html', ICO.truck, 'تامین‌کنندگان', supN + ' نفر')}
      ${dashTile('./checks.html', ICO.bank, 'چک‌ها', chkN + ' فقره')}
      ${dashTile('./inventory.html', ICO.warehouse, 'انبار', toman(invVal) + ' ت')}
      ${dashTile('./visits.html', ICO.map, 'ویزیت مشتریان', '')}
      ${dashTile('./prospects.html', ICO.map, 'ارزیابی مغازه‌ها', '')}
      ${dashTile('./reports.html', ICO.chart, 'گزارش‌ها', '')}
      ${dashTile('./settings.html', ICO.gear, 'تنظیمات و بکاپ', '')}
    </div>

    ${recentInvoicesHtml()}
    ${recentVisitsHtml()}
  `;
});

/** Read-only UI for existing ProspectScout dailyTarget — no writes except ensure day-roll already in core.
 *  Display gate (UI only): active progress only after at least one visit today (count >= 1).
 *  Restore/backup may restore target>0 with count=0; keep compact/raw until first visit. */
function renderDashboardTargetBar(dt){
  const target = dt ? (Number(dt.target)||0) : 0;
  const count = dt ? (Number(dt.count)||0) : 0;
  // Compact/raw until first visit — independent of stored target value
  if(!dt || target <= 0 || count < 1){
    return `<a class="dash-target dash-target-compact" href="./prospects.html">
      <span class="dash-target-title">تارگت امروز تنظیم نشده</span>
      <span class="dash-target-link">تنظیم ←</span>
    </a>`;
  }
  const pct = Math.min(100, Math.round((count/target)*100));
  const remain = Math.max(0, target - count);
  const done = count >= target;
  const status = done
    ? `<span class="dash-target-done">تارگت امروز تکمیل شد ✓</span>`
    : `<span class="dash-target-remain">${remain} بازدید تا تارگت</span>`;
  return `<a class="dash-target${done?' is-done':''}" href="./prospects.html">
    <div class="dash-target-top">
      <span class="dash-target-title">تارگت امروز</span>
      <span class="dash-target-pct">${pct}٪</span>
    </div>
    <div class="dash-target-nums">${count} / ${target}</div>
    <div class="dash-target-bar"><span style="width:${pct}%"></span></div>
    <div class="dash-target-foot">${status}<span class="dash-target-link">جزئیات ←</span></div>
  </a>`;
}
